<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#F0EDE6"/>
  
  <!-- Floor -->
  <rect y="480" width="800" height="120" fill="#D8D2C8" opacity="0.5"/>
  <!-- Wall -->
  <rect width="800" height="480" fill="#E8E4DC" opacity="0.6"/>
  
  <!-- Window light -->
  <rect x="0" y="60" width="180" height="300" fill="#C8D8C0" opacity="0.25"/>
  <rect x="620" y="60" width="180" height="300" fill="#C8D8C0" opacity="0.25"/>
  
  <!-- Blackboard -->
  <rect x="200" y="60" width="400" height="220" fill="#1E3D2B" opacity="0.12" rx="4"/>
  <text x="400" y="185" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#1E3D2B" opacity="0.2">Aula</text>
  
  <!-- Desks - row 1 -->
  <g fill="#1E3D2B" opacity="0.15">
    <rect x="120" y="360" width="80" height="40" rx="2"/>
    <rect x="230" y="360" width="80" height="40" rx="2"/>
    <rect x="340" y="360" width="80" height="40" rx="2"/>
    <rect x="450" y="360" width="80" height="40" rx="2"/>
    <rect x="560" y="360" width="80" height="40" rx="2"/>
  </g>
  <!-- Desk legs -->
  <g fill="#1E3D2B" opacity="0.1">
    <rect x="124" y="400" width="6" height="50"/>
    <rect x="190" y="400" width="6" height="50"/>
    <rect x="234" y="400" width="6" height="50"/>
    <rect x="300" y="400" width="6" height="50"/>
    <rect x="344" y="400" width="6" height="50"/>
    <rect x="410" y="400" width="6" height="50"/>
  </g>
  <!-- Students (simple silhouettes) -->
  <g fill="#1E3D2B" opacity="0.22">
    <circle cx="160" cy="342" r="14"/>
    <rect x="152" y="356" width="16" height="20" rx="2"/>
    <circle cx="270" cy="342" r="14"/>
    <rect x="262" y="356" width="16" height="20" rx="2"/>
    <circle cx="380" cy="342" r="14"/>
    <rect x="372" y="356" width="16" height="20" rx="2"/>
    <circle cx="490" cy="342" r="14"/>
    <rect x="482" y="356" width="16" height="20" rx="2"/>
    <circle cx="600" cy="342" r="14"/>
    <rect x="592" y="356" width="16" height="20" rx="2"/>
  </g>
  
  <!-- Teacher desk front -->
  <rect x="300" y="310" width="200" height="35" fill="#1E3D2B" opacity="0.12" rx="2"/>
  
  <!-- Border -->
  <rect x="1" y="1" width="798" height="598" fill="none" stroke="#D0CCC4" stroke-width="1"/>
  
  <!-- Label -->
  <rect x="260" y="556" width="280" height="24" rx="3" fill="#1E3D2B" opacity="0.07"/>
  <text x="400" y="572" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#1E3D2B" opacity="0.5" letter-spacing="0.8">classroom · 800 × 600</text>
</svg>
