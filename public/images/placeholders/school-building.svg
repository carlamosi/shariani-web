<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#F0EDE6"/>
  <defs>
    <linearGradient id="sky2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#CBD8C5;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#E8E4DC;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="800" height="350" fill="url(#sky2)"/>
  
  <!-- Ground -->
  <rect y="450" width="800" height="150" fill="#A8B89A" opacity="0.35"/>
  <rect y="430" width="800" height="30" fill="#B8C4A8" opacity="0.4"/>
  
  <!-- Main building -->
  <rect x="100" y="220" width="580" height="250" fill="#1E3D2B" opacity="0.14" rx="2"/>
  <!-- Roof -->
  <polygon points="80,220 400,120 720,220" fill="#1E3D2B" opacity="0.18"/>
  <!-- Windows row -->
  <rect x="140" y="260" width="70" height="80" fill="#1E3D2B" opacity="0.1" rx="3"/>
  <rect x="240" y="260" width="70" height="80" fill="#1E3D2B" opacity="0.1" rx="3"/>
  <rect x="460" y="260" width="70" height="80" fill="#1E3D2B" opacity="0.1" rx="3"/>
  <rect x="560" y="260" width="70" height="80" fill="#1E3D2B" opacity="0.1" rx="3"/>
  <!-- Door -->
  <rect x="352" y="330" width="60" height="140" fill="#1E3D2B" opacity="0.12" rx="3"/>
  
  <!-- Big tree right -->
  <rect x="636" y="260" width="18" height="210" fill="#1E3D2B" opacity="0.2"/>
  <ellipse cx="645" cy="210" rx="90" ry="100" fill="#1E3D2B" opacity="0.18"/>
  <ellipse cx="620" cy="240" rx="55" ry="65" fill="#1E3D2B" opacity="0.12"/>
  
  <!-- Small trees left -->
  <rect x="90" y="330" width="12" height="120" fill="#1E3D2B" opacity="0.2"/>
  <ellipse cx="96" cy="300" rx="40" ry="50" fill="#1E3D2B" opacity="0.18"/>
  
  <!-- Sign -->
  <rect x="280" y="200" width="240" height="28" rx="2" fill="#1E3D2B" opacity="0.12"/>
  <text x="400" y="219" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#1E3D2B" opacity="0.45" letter-spacing="0.5">Shariani Primary School</text>
  
  <!-- Border -->
  <rect x="1" y="1" width="798" height="598" fill="none" stroke="#D0CCC4" stroke-width="1"/>
  
  <!-- Label -->
  <rect x="250" y="556" width="300" height="24" rx="3" fill="#1E3D2B" opacity="0.07"/>
  <text x="400" y="572" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#1E3D2B" opacity="0.5" letter-spacing="0.8">school-building · 800 × 600</text>
</svg>
