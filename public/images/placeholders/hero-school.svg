<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 630" width="1440" height="630">
  <!-- Background -->
  <rect width="1440" height="630" fill="#F0EDE6"/>
  
  <!-- Sky gradient -->
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C8D8C8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8E4DC;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8C4A8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8FA882;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="1440" height="420" fill="url(#sky)" opacity="0.6"/>
  
  <!-- Ground -->
  <rect y="400" width="1440" height="230" fill="url(#ground)" opacity="0.4"/>
  
  <!-- Tree silhouettes left -->
  <ellipse cx="200" cy="280" rx="80" ry="90" fill="#1E3D2B" opacity="0.25"/>
  <rect x="192" y="350" width="16" height="100" fill="#1E3D2B" opacity="0.25"/>
  
  <!-- Large tree center-right -->
  <ellipse cx="900" cy="240" rx="120" ry="140" fill="#1E3D2B" opacity="0.2"/>
  <rect x="890" y="350" width="20" height="150" fill="#1E3D2B" opacity="0.2"/>
  
  <!-- School building silhouette center -->
  <rect x="380" y="280" width="520" height="200" fill="#1E3D2B" opacity="0.18" rx="2"/>
  <!-- Roof -->
  <polygon points="360,280 660,200 960,280" fill="#1E3D2B" opacity="0.22"/>
  <!-- Windows -->
  <rect x="420" y="310" width="60" height="70" fill="#1E3D2B" opacity="0.12" rx="2"/>
  <rect x="510" y="310" width="60" height="70" fill="#1E3D2B" opacity="0.12" rx="2"/>
  <rect x="600" y="310" width="60" height="70" fill="#1E3D2B" opacity="0.12" rx="2"/>
  <rect x="720" y="310" width="60" height="70" fill="#1E3D2B" opacity="0.12" rx="2"/>
  <rect x="810" y="310" width="60" height="70" fill="#1E3D2B" opacity="0.12" rx="2"/>
  <!-- Door -->
  <rect x="640" y="360" width="50" height="120" fill="#1E3D2B" opacity="0.15" rx="1"/>
  
  <!-- Small figures (students) -->
  <g opacity="0.35" fill="#1E3D2B">
    <circle cx="500" cy="460" r="12"/>
    <rect x="494" y="472" width="12" height="28" rx="2"/>
    <circle cx="540" cy="455" r="12"/>
    <rect x="534" y="467" width="12" height="28" rx="2"/>
    <circle cx="580" cy="462" r="12"/>
    <rect x="574" y="474" width="12" height="28" rx="2"/>
    <circle cx="800" cy="458" r="12"/>
    <rect x="794" y="470" width="12" height="28" rx="2"/>
    <circle cx="840" cy="462" r="12"/>
    <rect x="834" y="474" width="12" height="28" rx="2"/>
  </g>
  
  <!-- Border -->
  <rect x="1" y="1" width="1438" height="628" fill="none" stroke="#C8C4BA" stroke-width="1" opacity="0.8"/>
  
  <!-- Label -->
  <rect x="560" y="580" width="320" height="28" rx="3" fill="#1E3D2B" opacity="0.08"/>
  <text x="720" y="599" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1E3D2B" opacity="0.6" letter-spacing="1">hero-school · 1440 × 630</text>
</svg>
