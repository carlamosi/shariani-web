<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#F0EDE6"/>
  
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C8D4BC;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#E8E4DC;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="380" fill="url(#bg5)"/>
  <rect y="380" width="800" height="70" fill="#A0AA90" opacity="0.35"/>
  
  <!-- Group of people silhouettes -->
  <!-- Person 1 -->
  <g transform="translate(180, 260)" fill="#1E3D2B" opacity="0.22">
    <circle cx="0" cy="-80" r="28"/>
    <path d="M -30 -52 L -40 40 L 40 40 L 30 -52 C 20 -58 -20 -58 -30 -52 Z"/>
  </g>
  <!-- Person 2 (taller) -->
  <g transform="translate(280, 240)" fill="#1E3D2B" opacity="0.22">
    <circle cx="0" cy="-90" r="30"/>
    <path d="M -32 -60 L -42 50 L 42 50 L 32 -60 C 22 -66 -22 -66 -32 -60 Z"/>
  </g>
  <!-- Person 3 -->
  <g transform="translate(380, 255)" fill="#1E3D2B" opacity="0.22">
    <circle cx="0" cy="-75" r="27"/>
    <path d="M -28 -48 L -38 45 L 38 45 L 28 -48 C 18 -54 -18 -54 -28 -48 Z"/>
  </g>
  <!-- Person 4 -->
  <g transform="translate(470, 245)" fill="#1E3D2B" opacity="0.22">
    <circle cx="0" cy="-85" r="29"/>
    <path d="M -30 -56 L -40 48 L 40 48 L 30 -56 C 20 -62 -20 -62 -30 -56 Z"/>
  </g>
  <!-- Person 5 (child) -->
  <g transform="translate(560, 280)" fill="#1E3D2B" opacity="0.22">
    <circle cx="0" cy="-55" r="20"/>
    <path d="M -22 -35 L -28 35 L 28 35 L 22 -35 C 14 -40 -14 -40 -22 -35 Z"/>
  </g>
  <!-- Person 6 -->
  <g transform="translate(620, 250)" fill="#1E3D2B" opacity="0.22">
    <circle cx="0" cy="-82" r="28"/>
    <path d="M -30 -54 L -38 46 L 38 46 L 30 -54 C 20 -60 -20 -60 -30 -54 Z"/>
  </g>
  
  <!-- Tree background -->
  <ellipse cx="100" cy="160" rx="80" ry="100" fill="#1E3D2B" opacity="0.12"/>
  <rect x="93" y="240" width="14" height="160" fill="#1E3D2B" opacity="0.12"/>
  <ellipse cx="700" cy="150" rx="90" ry="110" fill="#1E3D2B" opacity="0.1"/>
  <rect x="693" y="240" width="14" height="160" fill="#1E3D2B" opacity="0.1"/>
  
  <!-- Border -->
  <rect x="1" y="1" width="798" height="448" fill="none" stroke="#D0CCC4" stroke-width="1"/>
  
  <!-- Label -->
  <rect x="240" y="412" width="320" height="22" rx="3" fill="#1E3D2B" opacity="0.07"/>
  <text x="400" y="427" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#1E3D2B" opacity="0.5" letter-spacing="0.8">community · 800 × 450</text>
</svg>
